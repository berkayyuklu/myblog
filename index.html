<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Blogum</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Shadows Into Light', cursive;
        }
        .slide-enter {
            animation: slideIn 0.6s ease-out;
        }
        @keyframes slideIn {
            from {
                transform: perspective(1000px) rotateY(-15deg);
                opacity: 0;
            }
            to {
                transform: perspective(1000px) rotateY(0deg);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Edit2: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Trash2: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Plus: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            X: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            LogOut: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Heart: ({ filled, isGold }) => <svg width="20" height="20" viewBox="0 0 24 24" fill={filled ? (isGold ? "#FFD700" : "currentColor") : "none"} stroke={isGold ? "#FFD700" : "currentColor"} strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
            Share2: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>,
            MessageCircle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>,
            User: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Upload: () => <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            ChevronLeft: () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="15 18 9 12 15 6"/></svg>,
            ChevronRight: () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="9 18 15 12 9 6"/></svg>,
            Eye: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        };

        function ModernBlog() {
            const [currentUser, setCurrentUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [authMode, setAuthMode] = useState('login');
            const [authForm, setAuthForm] = useState({ username: '', password: '', email: '' });
            const [authError, setAuthError] = useState('');
            const [users, setUsers] = useState([{ id: 1, username: 'admin', password: '1221', email: 'admin@blog.com', isAdmin: true }]);
            const [currentSlide, setCurrentSlide] = useState(0);
            const [posts, setPosts] = useState([
                { id: 1, title: 'Hoş Geldiniz', content: 'Minimalist ve şık tasarımıyla kişisel blogunuza hoş geldiniz.', image: 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=1200&h=600&fit=crop', date: '2026-01-22', likes: [], comments: [], views: 45, isFeatured: true, showInFeed: true },
                { id: 2, title: 'Yaratıcılık', content: 'Her an yeni fikirler ve ilham.', image: 'https://images.unsplash.com/photo-1487088678257-3a541e6e3922?w=1200&h=600&fit=crop', date: '2026-01-21', likes: [], comments: [], views: 32, isFeatured: true, showInFeed: true },
                { id: 3, title: 'Keşfet', content: 'Dünyayı keşfetmeye devam edin.', image: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&h=600&fit=crop', date: '2026-01-20', likes: [], comments: [], views: 28, isFeatured: false, showInFeed: true }
            ]);
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingPost, setEditingPost] = useState(null);
            const [newPost, setNewPost] = useState({ title: '', content: '', image: '', isFeatured: false, showInFeed: true });
            const [commentText, setCommentText] = useState({});
            const [uploadMode, setUploadMode] = useState('url');
            const [isDragging, setIsDragging] = useState(false);
            const [expandedPost, setExpandedPost] = useState(null);

            const featuredPosts = posts.filter(p => p.isFeatured);

            useEffect(() => {
                if (featuredPosts.length > 0) {
                    const timer = setInterval(() => {
                        setCurrentSlide((prev) => (prev + 1) % featuredPosts.length);
                    }, 3000);
                    return () => clearInterval(timer);
                }
            }, [featuredPosts.length]);

            const handleAuth = () => {
                setAuthError('');
                if (authMode === 'login') {
                    const user = users.find(u => u.username === authForm.username && u.password === authForm.password);
                    if (user) {
                        setCurrentUser(user);
                        setShowAuthModal(false);
                        setAuthForm({ username: '', password: '', email: '' });
                    } else {
                        setAuthError('Kullanıcı adı veya parola hatalı');
                    }
                } else {
                    if (!authForm.username || !authForm.password || !authForm.email) {
                        setAuthError('Lütfen tüm alanları doldurun');
                        return;
                    }
                    if (users.find(u => u.username === authForm.username)) {
                        setAuthError('Bu kullanıcı adı zaten kullanılıyor');
                        return;
                    }
                    const newUser = { id: Date.now(), username: authForm.username, password: authForm.password, email: authForm.email, isAdmin: false };
                    setUsers([...users, newUser]);
                    setCurrentUser(newUser);
                    setShowAuthModal(false);
                    setAuthForm({ username: '', password: '', email: '' });
                }
            };

            const handleFileUpload = (file) => {
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => { setNewPost({ ...newPost, image: e.target.result }); };
                    reader.readAsDataURL(file);
                } else {
                    alert('Lütfen geçerli bir resim dosyası seçin');
                }
            };

            const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
            const handleDragLeave = (e) => { e.preventDefault(); setIsDragging(false); };
            const handleDrop = (e) => { e.preventDefault(); setIsDragging(false); const file = e.dataTransfer.files[0]; handleFileUpload(file); };

            const handleLike = (postId) => {
                if (!currentUser) { alert('Beğenmek için giriş yapmalısınız!'); return; }
                setPosts(posts.map(p => {
                    if (p.id === postId) {
                        const likes = p.likes.includes(currentUser.id) ? p.likes.filter(id => id !== currentUser.id) : [...p.likes, currentUser.id];
                        return { ...p, likes };
                    }
                    return p;
                }));
            };

            const handleComment = (postId) => {
                if (!currentUser) { alert('Yorum yapmak için giriş yapmalısınız!'); return; }
                if (!commentText[postId]?.trim()) return;
                setPosts(posts.map(p => {
                    if (p.id === postId) {
                        return { ...p, comments: [...p.comments, { id: Date.now(), userId: currentUser.id, username: currentUser.username, text: commentText[postId], date: new Date().toISOString(), isAdminFavorite: false }] };
                    }
                    return p;
                }));
                setCommentText({ ...commentText, [postId]: '' });
            };

            const toggleAdminFavorite = (postId, commentId) => {
                setPosts(posts.map(p => {
                    if (p.id === postId) {
                        return { ...p, comments: p.comments.map(c => c.id === commentId ? { ...c, isAdminFavorite: !c.isAdminFavorite } : c) };
                    }
                    return p;
                }));
            };

            const deleteComment = (postId, commentId) => {
                if (confirm('Bu yorumu silmek istediğinizden emin misiniz?')) {
                    setPosts(posts.map(p => {
                        if (p.id === postId) {
                            return { ...p, comments: p.comments.filter(c => c.id !== commentId) };
                        }
                        return p;
                    }));
                }
            };

            const handleShare = (post) => {
                if (navigator.share) {
                    navigator.share({ title: post.title, text: post.content, url: window.location.href });
                } else {
                    alert('Paylaşım özelliği bu tarayıcıda desteklenmiyor.');
                }
            };

            const handleAddPost = () => {
                if (newPost.title && newPost.content) {
                    const post = { id: Date.now(), ...newPost, date: new Date().toISOString().split('T')[0], likes: [], comments: [], views: 0 };
                    setPosts([...posts, post]);
                    setNewPost({ title: '', content: '', image: '', isFeatured: false, showInFeed: true });
                    setShowAddModal(false);
                    setUploadMode('url');
                }
            };

            const handleUpdatePost = () => {
                if (editingPost && newPost.title && newPost.content) {
                    setPosts(posts.map(p => p.id === editingPost.id ? { ...p, ...newPost } : p));
                    setEditingPost(null);
                    setNewPost({ title: '', content: '', image: '', isFeatured: false, showInFeed: true });
                    setUploadMode('url');
                }
            };

            const handleDeletePost = (id) => {
                if (confirm('Bu gönderiyi silmek istediğinizden emin misiniz?')) {
                    setPosts(posts.filter(p => p.id !== id));
                }
            };

            const openEditModal = (post) => {
                setEditingPost(post);
                setNewPost({ title: post.title, content: post.content, image: post.image, isFeatured: post.isFeatured, showInFeed: post.showInFeed });
            };

            const nextSlide = () => { setCurrentSlide((prev) => (prev + 1) % featuredPosts.length); };
            const prevSlide = () => { setCurrentSlide((prev) => (prev - 1 + featuredPosts.length) % featuredPosts.length); };

            const toggleExpandPost = (postId) => {
                if (expandedPost === postId) {
                    setExpandedPost(null);
                } else {
                    setExpandedPost(postId);
                    setPosts(posts.map(p => p.id === postId ? { ...p, views: p.views + 1 } : p));
                }
            };
            return (
                <div className="min-h-screen bg-white">
                    <header className="border-b border-gray-200 bg-white sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                            <h1 className="text-3xl text-black">Blogum</h1>
                            <div className="flex items-center gap-4">
                                {currentUser ? (
                                    <>
                                        <span className="text-black">Merhaba, {currentUser.username}</span>
                                        {currentUser.isAdmin && (
                                            <button onClick={() => setShowAddModal(true)} className="flex items-center gap-2 bg-black text-white px-4 py-2 rounded hover:bg-gray-800 transition-colors">
                                                <Icons.Plus /> Yeni
                                            </button>
                                        )}
                                        <button onClick={() => setCurrentUser(null)} className="flex items-center gap-2 bg-black text-white px-4 py-2 rounded hover:bg-gray-800 transition-colors">
                                            <Icons.LogOut /> Çıkış
                                        </button>
                                    </>
                                ) : (
                                    <button onClick={() => { setShowAuthModal(true); setAuthMode('login'); setAuthError(''); }} className="flex items-center gap-2 bg-black text-white px-4 py-2 rounded hover:bg-gray-800 transition-colors">
                                        <Icons.User /> Giriş
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {featuredPosts.length > 0 && (
                        <div className="relative h-96 overflow-hidden bg-gray-100">
                            <div className="absolute inset-0 flex items-center justify-center">
                                {featuredPosts.map((post, index) => {
                                    const offset = index - currentSlide;
                                    const isActive = offset === 0;
                                    return (
                                        <div key={post.id} className={`absolute transition-all duration-700 ease-in-out ${isActive ? 'slide-enter' : ''}`} style={{ transform: `translateX(${offset * 100}%) scale(${isActive ? 1 : 0.85})`, opacity: Math.abs(offset) <= 1 ? (isActive ? 1 : 0.3) : 0, zIndex: isActive ? 20 : 10, width: '70%', maxWidth: '800px' }}>
                                            <div className="bg-white shadow-2xl rounded-lg overflow-hidden">
                                                {post.image && <img src={post.image} alt={post.title} className="w-full h-64 object-cover" />}
                                                <div className="p-6 text-center">
                                                    <h2 className="text-3xl text-black mb-2">{post.title}</h2>
                                                    <p className="text-gray-600 text-lg mb-4">{post.content}</p>
                                                    {currentUser?.isAdmin && isActive && (
                                                        <div className="flex gap-2 justify-center mt-4">
                                                            <button onClick={() => openEditModal(post)} className="flex items-center gap-1 bg-black text-white px-4 py-2 rounded hover:bg-gray-800 transition-colors text-sm">
                                                                <Icons.Edit2 /> Düzenle
                                                            </button>
                                                            <button onClick={() => handleDeletePost(post.id)} className="flex items-center gap-1 bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700 transition-colors text-sm">
                                                                <Icons.Trash2 /> Sil
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            <button onClick={prevSlide} className="absolute left-4 top-1/2 transform -translate-y-1/2 bg-white bg-opacity-80 hover:bg-opacity-100 rounded-full p-2 shadow-lg transition-all z-30">
                                <Icons.ChevronLeft />
                            </button>
                            <button onClick={nextSlide} className="absolute right-4 top-1/2 transform -translate-y-1/2 bg-white bg-opacity-80 hover:bg-opacity-100 rounded-full p-2 shadow-lg transition-all z-30">
                                <Icons.ChevronRight />
                            </button>
                            <div className="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-2 z-30">
                                {featuredPosts.map((_, index) => (
                                    <button key={index} onClick={() => setCurrentSlide(index)} className={`w-2 h-2 rounded-full transition-all ${index === currentSlide ? 'bg-black w-8' : 'bg-gray-400'}`} />
                                ))}
                            </div>
                        </div>
                    )}

                    <main className="max-w-6xl mx-auto px-4 py-12">
                        <h2 className="text-3xl text-black mb-8 text-center">Gönderiler</h2>
                        <div className="space-y-6">
                            {posts.filter(p => p.showInFeed).map(post => (
                                <div key={post.id} className="bg-white border border-gray-200 rounded-lg overflow-hidden">
                                    <div onClick={() => toggleExpandPost(post.id)} className="cursor-pointer hover:bg-gray-50 transition-colors">
                                        <div className="flex gap-4 p-4">
                                            {post.image && <img src={post.image} alt={post.title} className="w-32 h-32 object-cover rounded" />}
                                            <div className="flex-1">
                                                <h3 className="text-2xl text-black mb-2">{post.title}</h3>
                                                <p className="text-gray-600 mb-2 line-clamp-2">{post.content}</p>
                                                <div className="flex items-center gap-4 text-sm text-gray-500">
                                                    <span className="flex items-center gap-1"><Icons.Heart filled={false} /> {post.likes.length}</span>
                                                    <span className="flex items-center gap-1"><Icons.MessageCircle /> {post.comments.length}</span>
                                                    <span className="flex items-center gap-1"><Icons.Eye /> {post.views}</span>
                                                    <span>{post.date}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {expandedPost === post.id && (
                                        <div className="border-t border-gray-200">
                                            <div className="grid md:grid-cols-2 gap-6 p-6">
                                                <div>
                                                    {post.image && <img src={post.image} alt={post.title} className="w-full h-64 object-cover rounded mb-4" />}
                                                    <p className="text-gray-700 mb-6">{post.content}</p>
                                                    <div className="flex items-center gap-4 mb-4 pb-4 border-b border-gray-200">
                                                        <button onClick={(e) => { e.stopPropagation(); handleLike(post.id); }} className="flex items-center gap-1 text-gray-700 hover:text-red-500 transition-colors">
                                                            <Icons.Heart filled={currentUser && post.likes.includes(currentUser.id)} /> <span>{post.likes.length}</span>
                                                        </button>
                                                        <span className="flex items-center gap-1 text-gray-700"><Icons.MessageCircle /> <span>{post.comments.length}</span></span>
                                                        <span className="flex items-center gap-1 text-gray-700"><Icons.Eye /> <span>{post.views}</span></span>
                                                        <button onClick={(e) => { e.stopPropagation(); handleShare(post); }} className="flex items-center gap-1 text-gray-700 hover:text-green-500 transition-colors ml-auto">
                                                            <Icons.Share2 />
                                                        </button>
                                                    </div>
                                                    {currentUser?.isAdmin && (
                                                        <div className="flex gap-2">
                                                            <button onClick={(e) => { e.stopPropagation(); openEditModal(post); }} className="flex items-center gap-1 bg-black text-white px-3 py-2 rounded hover:bg-gray-800 transition-colors text-sm">
                                                                <Icons.Edit2 /> Düzenle
                                                            </button>
                                                            <button onClick={(e) => { e.stopPropagation(); handleDeletePost(post.id); }} className="flex items-center gap-1 bg-gray-800 text-white px-3 py-2 rounded hover:bg-gray-700 transition-colors text-sm">
                                                                <Icons.Trash2 /> Sil
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>

                                                <div>
                                                    <h4 className="text-xl text-black mb-4">Yorumlar ({post.comments.length})</h4>
                                                    <div className="space-y-3 mb-4 max-h-96 overflow-y-auto">
                                                        {post.comments.map(comment => (
                                                            <div key={comment.id} className="bg-gray-50 p-3 rounded">
                                                                <div className="flex items-start justify-between mb-1">
                                                                    <span className="font-bold text-black">{comment.username}</span>
                                                                    <div className="flex items-center gap-2">
                                                                        {currentUser?.isAdmin && (
                                                                            <>
                                                                                <button onClick={() => toggleAdminFavorite(post.id, comment.id)} className="hover:scale-110 transition-transform">
                                                                                    <Icons.Heart filled={comment.isAdminFavorite} isGold={comment.isAdminFavorite} />
                                                                                </button>
                                                                                <button onClick={() => deleteComment(post.id, comment.id)} className="text-red-600 hover:text-red-800">
                                                                                    <Icons.Trash2 />
                                                                                </button>
                                                                            </>
                                                                        )}
                                                                        {comment.isAdminFavorite && <span className="text-xs" style={{color: '#FFD700'}}>★ Admin Favorisi</span>}
                                                                    </div>
                                                                </div>
                                                                <p className="text-gray-700 text-sm">{comment.text}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    {currentUser && (
                                                        <div className="flex gap-2">
                                                            <input type="text" value={commentText[post.id] || ''} onChange={(e) => setCommentText({ ...commentText, [post.id]: e.target.value })} onKeyPress={(e) => e.key === 'Enter' && handleComment(post.id)} placeholder="Yorum yap..." className="flex-1 px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-black" />
                                                            <button onClick={() => handleComment(post.id)} className="bg-black text-white px-4 py-2 rounded hover:bg-gray-800 transition-colors">Gönder</button>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </main>

                    {showAuthModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg p-8 max-w-md w-full">
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-2xl text-black">{authMode === 'login' ? 'Giriş Yap' : 'Kayıt Ol'}</h2>
                                    <button onClick={() => { setShowAuthModal(false); setAuthError(''); }} className="text-gray-500 hover:text-black"><Icons.X /></button>
                                </div>
                                {authError && <div className="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">{authError}</div>}
                                <div className="space-y-4">
                                    <input type="text" value={authForm.username} onChange={(e) => setAuthForm({ ...authForm, username: e.target.value })} placeholder="Kullanıcı Adı" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-black" />
                                    {authMode === 'register' && <input type="email" value={authForm.email} onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })} placeholder="E-posta" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-black" />}
                                    <input type="password" value={authForm.password} onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })} onKeyPress={(e) => e.key === 'Enter' && handleAuth()} placeholder="Şifre" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-black" />
                                    <button onClick={handleAuth} className="w-full bg-black text-white py-3 rounded hover:bg-gray-800 transition-colors">{authMode === 'login' ? 'Giriş Yap' : 'Kayıt Ol'}</button>
                                    <button onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }} className="w-full text-gray-600 hover:text-black transition-colors">{authMode === 'login' ? 'Hesabın yok mu? Kayıt ol' : 'Zaten hesabın var mı? Giriş yap'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {(showAddModal || editingPost) && currentUser?.isAdmin && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-2xl text-black">{editingPost ? 'Gönderiyi Düzenle' : 'Yeni Gönderi'}</h2>
                                    <button onClick={() => { setShowAddModal(false); setEditingPost(null); setNewPost({ title: '', content: '', image: '', isFeatured: false, showInFeed: true }); setUploadMode('url'); }} className="text-gray-500 hover:text-black"><Icons.X /></button>
                                </div>
                                <div className="space-y-4">
                                    <input type="text" value={newPost.title} onChange={(e) => setNewPost({ ...newPost, title: e.target.value })} placeholder="Başlık" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-black" />
                                    <textarea value={newPost.content} onChange={(e) => setNewPost({ ...newPost, content: e.target.value })} placeholder="İçerik" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-black h-32" />
                                    
                                    <div className="space-y-2">
                                        <label className="flex items-center gap-2 text-black">
                                            <input type="checkbox" checked={newPost.isFeatured} onChange={(e) => setNewPost({ ...newPost, isFeatured: e.target.checked })} className="w-4 h-4" />
                                            <span>Öne Çıkanlar'da göster</span>
                                        </label>
                                        <label className="flex items-center gap-2 text-black">
                                            <input type="checkbox" checked={newPost.showInFeed} onChange={(e) => setNewPost({ ...newPost, showInFeed: e.target.checked })} className="w-4 h-4" />
                                            <span>Gönderiler'de göster</span>
                                        </label>
                                    </div>

                                    <div className="flex gap-2 border-b border-gray-200 pb-2">
                                        <button onClick={() => setUploadMode('url')} className={`px-4 py-2 rounded transition-colors ${uploadMode === 'url' ? 'bg-black text-white' : 'bg-gray-100 text-black hover:bg-gray-200'}`}>URL</button>
                                        <button onClick={() => setUploadMode('upload')} className={`flex items-center gap-2 px-4 py-2 rounded transition-colors ${uploadMode === 'upload' ? 'bg-black text-white' : 'bg-gray-100 text-black hover:bg-gray-200'}`}>Dosya Yükle</button>
                                    </div>

                                    {uploadMode === 'url' && <input type="text" value={newPost.image} onChange={(e) => setNewPost({ ...newPost, image: e.target.value })} placeholder="Görsel URL" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-black" />}

                                    {uploadMode === 'upload' && (
                                        <div onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop} className={`border-2 border-dashed rounded-lg p-8 text-center transition-colors ${isDragging ? 'border-black bg-gray-50' : 'border-gray-300'}`}>
                                            <div className="text-gray-400 mb-4 flex justify-center"><Icons.Upload /></div>
                                            <p className="text-gray-600 mb-2">Fotoğrafı buraya sürükleyin</p>
                                            <p className="text-gray-500 text-sm mb-4">veya</p>
                                            <label className="bg-black text-white px-6 py-2 rounded cursor-pointer hover:bg-gray-800 transition-colors inline-block">
                                                Dosya Seç
                                                <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e.target.files[0])} className="hidden" />
                                            </label>
                                        </div>
                                    )}

                                    {newPost.image && (
                                        <div className="relative">
                                            <img src={newPost.image} alt="Önizleme" className="w-full rounded max-h-64 object-cover" />
                                            <button onClick={() => setNewPost({ ...newPost, image: '' })} className="absolute top-2 right-2 bg-red-600 text-white p-2 rounded-full hover:bg-red-700 transition-colors"><Icons.X /></button>
                                        </div>
                                    )}
                                    
                                    <button onClick={editingPost ? handleUpdatePost : handleAddPost} className="w-full bg-black text-white py-3 rounded hover:bg-gray-800 transition-colors">{editingPost ? 'Güncelle' : 'Yayınla'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<ModernBlog />, document.getElementById('root'));
    </script>
</body>
</html>
